# Full local stack: Postgres, Redis, Kafka (KRaft, no ZooKeeper), the API and
# the worker.
#
# Run from the repository root:  make up
name: pr-sentinel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prsentinel
      POSTGRES_PASSWORD: prsentinel
      POSTGRES_DB: prsentinel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prsentinel -d prsentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # No persistence: everything in Redis here is a cache or a lease, and both
    # are safe to lose on restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      # Two advertised listeners: INTERNAL for containers on this network,
      # PLAINTEXT on localhost for tooling run from the host.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: pr-sentinel-local-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { TARGET: api }
    ports: ["8080:8080"]
    environment:
      POSTGRES_DSN: postgres://prsentinel:prsentinel@postgres:5432/prsentinel?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      DRY_RUN: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { TARGET: worker }
    environment:
      POSTGRES_DSN: postgres://prsentinel:prsentinel@postgres:5432/prsentinel?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      DRY_RUN: "true"
      WORKER_CONCURRENCY: "2"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set to run the worker}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    # Two replicas to exercise the claim/lock path that prevents duplicate
    # reviews when Kafka redelivers.
    deploy:
      replicas: 2

volumes:
  pgdata:
